<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botões de Famosos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #fff;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.2rem;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            max-width: 900px;
            margin-bottom: 40px;
        }

        button {
            background: linear-gradient(145deg, #e94560, #c23152);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(233, 69, 96, 0.6);
            background: linear-gradient(145deg, #ff6b81, #e94560);
        }

        button:active {
            transform: translateY(0);
        }

         .container-imagem {
            width: 100%;
            max-width: 500px;
            height: 450px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .container-imagem img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
            animation: fadeIn 0.4s ease;
        }

        .placeholder {
            color: rgba(255,255,255,0.5);
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }

        .nome-exibido {
            margin-top: 20px;
            font-size: 1.4rem;
            font-weight: 600;
            min-height: 30px;
            text-align: center;
            color: #ff6b81;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            button { padding: 12px 20px; font-size: 0.95rem; }
            .container-imagem { height: 350px; }
        }

        </style>
</head>
<body>
    <h1>Escolha um Famoso</h1>

    <div class="botoes">
        <button onclick="mostrarImagem('einstein')">Albert Einstein</button>
        <button onclick="mostrarImagem('monroe')">Marilyn Monroe</button>
        <button onclick="mostrarImagem('turing')">Alan Turing</button>
        <button onclick="mostrarImagem('frida')">Frida Kahlo</button>
        <button onclick="mostrarImagem('pele')">Pelé</button>
        <button onclick="mostrarImagem('curie')">Marie Curie</button>
        <button onclick="mostrarImagem('jobs')">Steve Jobs</button>
        <button onclick="mostrarImagem('mandela')">Nelson Mandela</button>
    </div>

    <div class="container-imagem" id="container">
        <p class="placeholder">Clique em um botão para ver a imagem</p>
    </div>

    <div class="nome-exibido" id="nome"></div>
